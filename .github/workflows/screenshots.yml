name: Screenshot renders

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[shots]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Render screen screenshots (Robolectric, offline fixtures)
        run: |
          set -o pipefail
          # Explicit classes: PlayAssetsTest renders eight full-size 1080x1920 PNGs and belongs to the
          # manual play_assets job, not to every push.
          gradle :app:testDebugUnitTest \
            --tests "ng.name.servix.app.screenshots.ScreenshotTest" \
            --tests "ng.name.servix.app.screenshots.TypographyTest" \
            --no-daemon --stacktrace 2>&1 | tee gradle-screenshots.log

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          # CI output is never committed: it goes to an artifact.
          mkdir -p ci-failure
          if [ -f gradle-screenshots.log ]; then
            grep -E "^e: |error:|Execution failed|Caused by|AssertionError|IllegalStateException|FAILED" \
              gradle-screenshots.log | head -40 > ci-failure/screenshots.txt || true
          fi
          # JUnit XML is the only channel readable from a dev sandbox, so name each failing test.
          python3 - <<'PY' || true
          import glob
          import re

          found = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              try:
                  data = open(path, encoding="utf-8", errors="replace").read()
              except OSError:
                  continue
              for case in re.finditer(r"<testcase\b[^>]*>", data):
                  head = case.group(0)
                  name = re.search(r"name=\"([^\"]+)\"", head)
                  if not name:
                      continue
                  tail = data[case.end():case.end() + 4000].lstrip()
                  if not (tail.startswith("<failure") or tail.startswith("<error")):
                      continue
                  msg = re.search(r"<(?:failure|error)\b[^>]*message=\"([^\"]*)\"", tail)
                  detail = msg.group(1) if msg else re.sub(r"<[^>]+>", " ", tail[:600])
                  for entity, char in (("&quot;", '"'), ("&gt;", ">"), ("&lt;", "<"), ("&amp;", "&")):
                      detail = detail.replace(entity, char)
                  found.append((name.group(1), " ".join(detail.split())[:350]))
          for name, detail in found[:10]:
              print("::error::" + name + " - " + detail)
          print("::notice::failing test cases: " + str(len(found)))
          PY
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: ci-failure/
          if-no-files-found: ignore

      - name: Report compile errors, continued (11-20)
        if: failure()
        shell: bash
        run: |
          # GitHub caps annotations per step, so a long cascade needs a second step.
          if [ -f gradle-screenshots.log ]; then
            grep -E "^e: " gradle-screenshots.log | sed -n '11-20' \
              | sed 's#file:///home/runner/work/servix-android/servix-android/##' \
              | while IFS= read -r line; do echo "::error::${line}"; done || true
          fi
          true
      - name: Report compile errors, continued (21-30)
        if: failure()
        shell: bash
        run: |
          # GitHub caps annotations per step, so a long cascade needs a second step.
          if [ -f gradle-screenshots.log ]; then
            grep -E "^e: " gradle-screenshots.log | sed -n '21-30' \
              | sed 's#file:///home/runner/work/servix-android/servix-android/##' \
              | while IFS= read -r line; do echo "::error::${line}"; done || true
          fi
          true
      - name: Upload renders artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screen-renders
          path: app/build/reports/screenshots/screens/*.png
          if-no-files-found: ignore

      - name: Publish renders for review (sentinel-gated)
        if: success()
        run: |
          if [ ! -f docs/screenshots/COMMIT_RENDERS ]; then
            echo "docs/screenshots/COMMIT_RENDERS is absent: renders stay in the artifact only."
            exit 0
          fi
          # ScreenshotHarness already writes 50 % copies, so the repository only ever sees the
          # half-size set (the full-size renders stay in the workflow artifact).
          rm -f docs/screenshots/*.png
          cp app/build/reports/screenshots/screens/*.png docs/screenshots/
          ls -1 docs/screenshots/*.png | wc -l
          git add -A docs/screenshots
          if git diff --cached --quiet; then
            echo "Renders are byte-identical to the committed set; nothing to publish."
            exit 0
          fi
          git commit -m "chore: screen renders for ${GITHUB_SHA::7} [shots]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-screenshots-log
          path: gradle-screenshots.log
          if-no-files-found: ignore

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-report
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore

  play_assets:
    # Store art is rendered only when someone asks for it: it changes when a screen changes, and
    # committing ~3 MB of PNGs on every push would bloat history. Manual dispatch only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Render Play assets (Robolectric harness, offline fixtures)
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --tests "ng.name.servix.app.screenshots.PlayAssetsTest" \
            --no-daemon --stacktrace 2>&1 | tee gradle-play-assets.log

      - name: Verify asset dimensions
        shell: bash
        run: |
          set -euo pipefail
          BASE=app/build/reports/screenshots/play
          # Width/height straight out of the PNG IHDR chunk (bytes 16-23, big endian).
          png_dims() {
            od -An -tu4 -j16 -N4 --endian=big "$1" | tr -d ' \n'
            printf 'x'
            od -An -tu4 -j20 -N4 --endian=big "$1" | tr -d ' \n'
          }

          fail=0
          shopt -s nullglob
          PHONE=("$BASE"/phone/*.png)
          if [ "${#PHONE[@]}" -ne 8 ]; then
            echo "::error::expected 8 phone screenshots, found ${#PHONE[@]}"
            fail=1
          fi
          for f in "${PHONE[@]}"; do
            d=$(png_dims "$f")
            echo "phone $(basename "$f"): $d"
            [ "$d" = "1080x1920" ] || { echo "::error::$f is $d, expected 1080x1920"; fail=1; }
          done

          for spec in "icon-512.png:512x512" "feature-graphic-1024x500.png:1024x500"; do
            name=${spec%%:*}
            want=${spec##*:}
            if [ ! -f "$BASE/$name" ]; then
              echo "::error::$BASE/$name is missing"
              fail=1
              continue
            fi
            d=$(png_dims "$BASE/$name")
            echo "$name: $d"
            [ "$d" = "$want" ] || { echo "::error::$name is $d, expected $want"; fail=1; }
          done

          du -sh "$BASE"
          exit "$fail"

      - name: Upload Play assets as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: play-assets
          path: app/build/reports/screenshots/play/**
          retention-days: 30

      - name: Commit docs/play once
        id: commit
        run: |
          set -euo pipefail
          if [ -f docs/play/ASSETS_COMMITTED ]; then
            echo "::notice::docs/play/ASSETS_COMMITTED exists — the store art was already committed once. Rendering only; nothing re-committed. Delete the sentinel to publish a fresh set."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SRC=app/build/reports/screenshots/play
          mkdir -p docs/play/phone
          cp "$SRC"/phone/*.png docs/play/phone/
          cp "$SRC"/icon-512.png docs/play/
          cp "$SRC"/feature-graphic-1024x500.png docs/play/
          {
            echo "Rendered by the play_assets job in .github/workflows/screenshots.yml, run $GITHUB_RUN_ID on ${GITHUB_SHA:0:7}."
            echo "This file is a sentinel: while it exists the workflow re-renders but never re-commits,"
            echo "so the store art only enters git once. Delete it to allow a fresh commit."
            echo "Art only — no Play Console upload happens here."
          } > docs/play/ASSETS_COMMITTED
          ls -l docs/play docs/play/phone
          git config user.name "servix-ci"
          git config user.email "ci@servix.name.ng"
          git add -A docs/play
          git commit -m "docs(play): store assets — 8 phone screenshots, 512 icon, 1024x500 feature graphic [play-assets][shots]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          # CI output is never committed: it goes to an artifact.
          mkdir -p ci-failure
          grep -vE "kotlin metadata" gradle-play-assets.log 2>/dev/null \
            | grep -E "^e: |error:|expected |Execution failed|Caused by|PLAY_ASSET|FAILED|AssertionError|IllegalStateException" \
            | head -40 > ci-failure/play-assets.txt || true
          # JUnit XML carries the real assertion message and run logs are not always reachable,
          # so turn each failure into a check-run annotation.
          for f in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
            [ -f "$f" ] || continue
            tr '>' '>\n' < "$f" | grep -o 'failure message="[^"]*"' | head -5 \
              | sed 's/failure message="//; s/"$//' | cut -c1-300 \
              | while IFS= read -r msg; do echo "::error::${msg}"; done
          done
          grep -E "FAILED$|AssertionError|expected a .* window" gradle-play-assets.log 2>/dev/null | head -8 \
            | while IFS= read -r line; do echo "::error::$line"; done || true
          cp -f gradle-play-assets.log ci-failure/ 2>/dev/null || true
          wc -l ci-failure/* 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: ci-failure/
          if-no-files-found: ignore
