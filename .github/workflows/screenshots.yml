name: Screenshot renders

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Render screen screenshots (Robolectric, offline fixtures)
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --tests "ng.name.servix.app.screenshots.*" --no-daemon --stacktrace 2>&1 | tee gradle-screenshots.log

      - name: Surface Gradle errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|Execution failed|Caused by|AssertionError|IllegalStateException" gradle-screenshots.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/reports/screenshots/**/*.png
          if-no-files-found: error

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-screenshots-log
          path: gradle-screenshots.log
          if-no-files-found: ignore

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-report
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
